// Root Android build configuration.
// Configure the legacy telephony plugin at plugin-application time rather than
// using afterEvaluate, which is incompatible with current Gradle evaluation.
rootProject.buildDir = "../build"

subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}

subprojects {
    project.evaluationDependsOn(":app")
}

// telephony 0.2.0 predates AGP's mandatory namespace declaration.
// Configure its Android library extension as soon as the Android library plugin
// is applied. This runs before Android variant configuration and avoids the
// unsafe afterEvaluate hook that caused the previous CI failure.
subprojects { project ->
    project.pluginManager.withPlugin("com.android.library") {
        if (project.name == "telephony") {
            project.extensions.configure("android") {
                namespace = "com.shounakmulay.telephony"
            }
        }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
