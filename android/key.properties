# signing.properties — credentials for the loan-tracker release keystore.
#
# This file is committed to the repo because the keystore is a self-signed
# development keystore, NOT a Play Store upload key. It exists solely so
# that consecutive APK builds share the same signing certificate —
# allowing Android to apply in-place updates without forcing uninstall.
#
# If you ever publish to Google Play, replace this keystore with a real
# upload key stored in GitHub Secrets (NOT committed to the repo).
#
# Keystore file: android/app/keystore/loan-tracker-release.keystore
# Validity: 100 years (until 2126-08-25)

storePassword=loantracker123
keyPassword=loantracker123
keyAlias=loan-tracker
storeFile=keystore/loan-tracker-release.keystore
