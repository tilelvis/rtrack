name: loan_tracker
description: A personal loan repayment tracker with M-Pesa SMS auto-import, daily reminders, offline SQLite storage, PDF reports, payment receipts, monthly statements, lender contact, home-screen widget, and payment trend chart.
publish_to: 'none'
version: 1.9.1+17

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  sqflite: ^2.3.3+1
  path: ^1.9.0
  path_provider: ^2.1.4
  shared_preferences: ^2.2.3
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4
  permission_handler: ^11.3.1
  sms_autofill: ^2.3.0
  intl: ^0.19.0
  uuid: ^4.4.0
  flutter_svg: ^2.0.10+1
  google_fonts: ^6.2.1
  provider: ^6.1.2
  url_launcher: ^6.2.6
  pdf: ^3.10.8
  share_plus: ^9.0.0
  fl_chart: ^0.68.0
  telephony: ^0.2.0
  home_widget: ^0.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
