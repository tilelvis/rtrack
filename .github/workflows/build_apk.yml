name: Build APK

# ============================================================================
# ⚠️  BEFORE MODIFYING THIS FILE — READ BUILD_AUDIT.md (in repo root)
# ============================================================================
# This workflow is the result of a comprehensive audit (v1.7.2+13).
# It encodes a specific toolchain that is known to work. Changing any
# version number without re-auditing will likely re-introduce the
# chain of failures documented in BUILD_AUDIT.md §2.
#
# Manual trigger only. Auto-bumps patch version + build number when inputs
# are left empty. Produces a signed debug-keystore release APK that installs
# on any Android phone without needing Google Play.
#
# TOOLCHAIN (audited 2026-09-18):
#   Flutter 3.47.4   (pinned — do NOT use channel: stable)
#   Dart   3.13.3    (supplied by Flutter 3.47.4)
#   Java   17        (required by AGP 8.x)
#   Gradle 8.14.0    (declared in gradle-wrapper.properties)
#   AGP    8.11.1    (declared in settings.gradle.kts)
#   Kotlin 2.2.20    (declared in settings.gradle.kts)
#
# The namespace injection for legacy plugins (e.g. telephony 0.2.0) is
# implemented at the Gradle config level in android/build.gradle.kts via
# subprojects{...}. This is repository-level and survives clean checkouts.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Semantic version (e.g. 1.7.0). Leave empty to auto-bump patch."
        required: false
        default: ""
      build_number:
        description: "Build number (integer). Leave empty to auto-increment."
        required: false
        default: ""
      build_type:
        description: "Build type"
        required: true
        type: choice
        options:
          - release
          - debug
        default: release

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Flutter 3.47.4 — the audited, pinned version. Do NOT use channel:stable
      # (would drift to newer versions and re-introduce compatibility drift).
      - name: Setup Flutter 3.47.4 (pinned for reproducibility)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.4"
          channel: stable
          cache: true

      - name: Show tool versions
        run: |
          echo "=== Flutter ==="
          flutter --version
          echo ""
          echo "=== Dart ==="
          dart --version
          echo ""
          echo "=== Java ==="
          java -version
          echo ""
          echo "=== Gradle wrapper ==="
          cat android/gradle/wrapper/gradle-wrapper.properties | grep distributionUrl

      # ------------------------------------------------------------------
      # Defensive cleanup — remove any legacy Groovy gradle files that
      # would conflict with the declarative .kts files. This guarantees
      # the build always starts from a clean state regardless of repo
      # history (in case old files get re-committed accidentally).
      # ------------------------------------------------------------------
      - name: Remove legacy Groovy gradle files
        shell: bash
        run: |
          echo "=== Before cleanup ==="
          find android -maxdepth 3 -name "*.gradle*" -type f 2>/dev/null || true

          # Delete old Groovy-style gradle files (the .kts versions are
          # the source of truth for Flutter 3.16+).
          rm -f android/build.gradle
          rm -f android/settings.gradle
          rm -f android/app/build.gradle

          # Delete stale local.properties (regenerated below).
          rm -f android/local.properties

          # Delete generated plugin registrant (Flutter regenerates it).
          rm -f android/app/src/main/java/io/flutter/plugins/GeneratedPluginRegistrant.java
          rm -f android/app/src/main/kotlin/io/flutter/plugins/GeneratedPluginRegistrant.kt

          # Delete pubspec.lock so dependencies resolve fresh against the
          # pinned Flutter 3.47.4 version.
          rm -f pubspec.lock

          echo ""
          echo "=== After cleanup ==="
          find android -maxdepth 3 -name "*.gradle*" -type f 2>/dev/null

      # ------------------------------------------------------------------
      # Version handling — auto-bump or accept manual override
      # ------------------------------------------------------------------
      - name: Read current version from pubspec
        id: current
        shell: bash
        run: |
          VERSION_LINE=$(grep -m1 -E '^version:[[:space:]]*[0-9]+\.[0-9]+\.[0-9]+\+[0-9]+' pubspec.yaml)
          if [ -z "$VERSION_LINE" ]; then
            echo "::error::No valid 'version: X.Y.Z+N' line found in pubspec.yaml"
            grep -n '^version:' pubspec.yaml || true
            exit 1
          fi
          CURRENT_VERSION=$(echo "$VERSION_LINE" | sed -E 's/^version:[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+)\+([0-9]+).*$/\1/')
          CURRENT_BUILD=$(echo "$VERSION_LINE" | sed -E 's/^version:[[:space:]]*[0-9]+\.[0-9]+\.[0-9]+\+([0-9]+).*$/\1/')
          echo "current_version=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"
          echo "current_build=$CURRENT_BUILD" >> "$GITHUB_OUTPUT"
          echo "Current: $CURRENT_VERSION+$CURRENT_BUILD"

      - name: Compute new version
        id: next
        shell: bash
        run: |
          CURRENT_VERSION="${{ steps.current.outputs.current_version }}"
          CURRENT_BUILD="${{ steps.current.outputs.current_build }}"
          INPUT_VERSION="${{ github.event.inputs.version }}"
          INPUT_BUILD="${{ github.event.inputs.build_number }}"

          if [ -n "$INPUT_VERSION" ]; then
            NEW_VERSION="$INPUT_VERSION"
          else
            IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VERSION"
            NEW_VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))"
          fi

          if [ -n "$INPUT_BUILD" ]; then
            NEW_BUILD="$INPUT_BUILD"
          else
            NEW_BUILD=$((CURRENT_BUILD + 1))
          fi

          if ! echo "$NEW_VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Invalid version '$NEW_VERSION' (expected X.Y.Z)"
            exit 1
          fi
          if ! echo "$NEW_BUILD" | grep -qE '^[0-9]+$'; then
            echo "::error::Invalid build '$NEW_BUILD' (expected integer)"
            exit 1
          fi

          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "new_build=$NEW_BUILD" >> "$GITHUB_OUTPUT"
          echo "Bumping: $CURRENT_VERSION+$CURRENT_BUILD -> $NEW_VERSION+$NEW_BUILD"

      - name: Update pubspec.yaml version
        shell: bash
        run: |
          NEW_VERSION="${{ steps.next.outputs.new_version }}"
          NEW_BUILD="${{ steps.next.outputs.new_build }}"
          sed -i -E "0,/^version:.*/s//version: ${NEW_VERSION}+${NEW_BUILD}/" pubspec.yaml
          echo "Updated pubspec.yaml:"
          grep -m1 '^version:' pubspec.yaml

      # ------------------------------------------------------------------
      # Dependency resolution
      # ------------------------------------------------------------------
      - name: Flutter pub get
        run: flutter pub get

      - name: Ensure local.properties
        shell: bash
        run: |
          mkdir -p android
          cat > android/local.properties <<EOF
          sdk.dir=$ANDROID_SDK_ROOT
          flutter.sdk=$FLUTTER_ROOT
          flutter.buildMode=debug
          EOF
          echo "Wrote android/local.properties:"
          cat android/local.properties

      # ------------------------------------------------------------------
      # Static analysis — does NOT block the build on warnings.
      # Errors still block (which is correct because errors would also
      # fail the actual APK build below).
      # ------------------------------------------------------------------
      - name: Static analysis (errors block, warnings do not)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      # ------------------------------------------------------------------
      # APK build
      # ------------------------------------------------------------------
      - name: Build ${{ github.event.inputs.build_type }} APK
        run: |
          if [ "${{ github.event.inputs.build_type }}" = "release" ]; then
            flutter build apk --release \
              --build-name=${{ steps.next.outputs.new_version }} \
              --build-number=${{ steps.next.outputs.new_build }}
          else
            flutter build apk --debug \
              --build-name=${{ steps.next.outputs.new_version }} \
              --build-number=${{ steps.next.outputs.new_build }}
          fi

      # ------------------------------------------------------------------
      # Package + upload
      # ------------------------------------------------------------------
      - name: Stage APK + metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact
          BUILD_TYPE="${{ github.event.inputs.build_type }}"
          if [ "$BUILD_TYPE" = "release" ]; then
            APK_PATH="build/app/outputs/flutter-apk/app-release.apk"
          else
            APK_PATH="build/app/outputs/flutter-apk/app-debug.apk"
          fi
          if [ ! -f "$APK_PATH" ]; then
            echo "::error::APK not found at $APK_PATH"
            exit 1
          fi
          VERSION="${{ steps.next.outputs.new_version }}"
          BUILD="${{ steps.next.outputs.new_build }}"
          APK_NAME="loan_tracker-v${VERSION}+${BUILD}-${BUILD_TYPE}.apk"
          cp "$APK_PATH" "artifact/$APK_NAME"
          {
            echo "App: loan_tracker"
            echo "Version: ${VERSION}"
            echo "Build: ${BUILD}"
            echo "Type: ${BUILD_TYPE}"
            echo "Built: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo "Flutter: $(flutter --version | head -n 1)"
            echo "Commit: ${GITHUB_SHA::8}"
            echo "Run: ${GITHUB_RUN_NUMBER}"
          } > artifact/build_info.txt
          echo "${VERSION}" > artifact/version.txt
          echo "${BUILD}" > artifact/build_number.txt
          ls -lh artifact/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: loan-tracker-v${{ steps.next.outputs.new_version }}+${{ steps.next.outputs.new_build }}-${{ github.event.inputs.build_type }}
          path: artifact/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      # ------------------------------------------------------------------
      # Commit version bump (best-effort; won't fail the build if push fails)
      # ------------------------------------------------------------------
      - name: Commit & push version bump
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pubspec.yaml
          if git diff --cached --quiet; then
            echo "No version changes to commit."
            exit 0
          fi
          git commit -m "chore: bump version to v${{ steps.next.outputs.new_version }}+${{ steps.next.outputs.new_build }} [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          git push origin "HEAD:${GITHUB_REF_NAME}" || {
            echo "::warning::Failed to push (likely a concurrent build). The APK artifact is still available above."
          }
