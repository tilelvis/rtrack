name: Build APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: "App version (e.g. 1.3.1)"
        required: false
        default: ""
      build_number:
        description: "Build number (e.g. 5)"
        required: false
        default: ""
      build_type:
        description: "Build type"
        required: true
        type: choice
        options:
          - release
          - debug
        default: release

permissions:
  contents: write

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.4"
          channel: stable
          cache: true

      - name: Show Flutter and Dart versions
        run: |
          flutter --version
          dart --version

      - name: Read current version
        id: current_version
        shell: bash
        run: |
          VERSION_LINE=$(grep -m1 '^version:' pubspec.yaml)
          CURRENT_VERSION=$(echo "$VERSION_LINE" | sed -E 's/^version:[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+)\+([0-9]+).*$/\1/')
          CURRENT_BUILD=$(echo "$VERSION_LINE" | sed -E 's/^version:[[:space:]]*[0-9]+\.[0-9]+\.[0-9]+\+([0-9]+).*$/\1/')

          if [ -z "$CURRENT_VERSION" ] || [ -z "$CURRENT_BUILD" ]; then
            echo "Could not read version from pubspec.yaml"
            exit 1
          fi

          echo "current_version=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"
          echo "current_build=$CURRENT_BUILD" >> "$GITHUB_OUTPUT"

          echo "Current version: $CURRENT_VERSION"
          echo "Current build: $CURRENT_BUILD"

      - name: Calculate version
        id: version
        shell: bash
        run: |
          INPUT_VERSION="${{ github.event.inputs.version }}"
          INPUT_BUILD="${{ github.event.inputs.build_number }}"

          CURRENT_VERSION="${{ steps.current_version.outputs.current_version }}"
          CURRENT_BUILD="${{ steps.current_version.outputs.current_build }}"

          if [ -n "$INPUT_VERSION" ]; then
            NEW_VERSION="$INPUT_VERSION"
          else
            IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VERSION"
            PATCH=$((PATCH + 1))
            NEW_VERSION="$MAJOR.$MINOR.$PATCH"
          fi

          if [ -n "$INPUT_BUILD" ]; then
            NEW_BUILD="$INPUT_BUILD"
          else
            NEW_BUILD=$((CURRENT_BUILD + 1))
          fi

          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "new_build=$NEW_BUILD" >> "$GITHUB_OUTPUT"

          echo "New version: $NEW_VERSION"
          echo "New build: $NEW_BUILD"

      - name: Update pubspec version
        shell: bash
        run: |
          NEW_VERSION="${{ steps.version.outputs.new_version }}"
          NEW_BUILD="${{ steps.version.outputs.new_build }}"

          sed -i -E \
            "0,/^version:.*/s//version: ${NEW_VERSION}+${NEW_BUILD}/" \
            pubspec.yaml

          echo "Updated pubspec.yaml:"
          grep -m1 '^version:' pubspec.yaml

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Accept Android licenses
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Get dependencies
        run: flutter pub get

      - name: Ensure Android local.properties
        shell: bash
        run: |
          mkdir -p android

          cat > android/local.properties <<EOF
          sdk.dir=$ANDROID_SDK_ROOT
          flutter.sdk=$FLUTTER_ROOT
          EOF

      - name: Verify Flutter project
        # Keep lint feedback visible without blocking APK packaging on non-fatal info/warning diagnostics.
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build release APK
        if: github.event.inputs.build_type == 'release'
        run: flutter build apk --release

      - name: Build debug APK
        if: github.event.inputs.build_type == 'debug'
        run: flutter build apk --debug

      - name: Prepare APK
        shell: bash
        run: |
          mkdir -p build_output

          VERSION="${{ steps.version.outputs.new_version }}"
          BUILD="${{ steps.version.outputs.new_build }}"
          BUILD_TYPE="${{ github.event.inputs.build_type }}"

          if [ "$BUILD_TYPE" = "release" ]; then
            APK_PATH="build/app/outputs/flutter-apk/app-release.apk"
          else
            APK_PATH="build/app/outputs/flutter-apk/app-debug.apk"
          fi

          if [ ! -f "$APK_PATH" ]; then
            echo "APK not found at: $APK_PATH"
            exit 1
          fi

          cp "$APK_PATH" \
            "build_output/loan_tracker-v${VERSION}+${BUILD}-${BUILD_TYPE}.apk"

          cat > build_output/version.txt <<EOF
          Version: ${VERSION}
          Build: ${BUILD}
          Build type: ${BUILD_TYPE}
          Flutter: $(flutter --version | head -n 1)
          Commit: ${GITHUB_SHA}
          EOF

          ls -lh build_output

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: loan-tracker-v${{ steps.version.outputs.new_version }}+${{ steps.version.outputs.new_build }}-${{ github.event.inputs.build_type }}
          path: build_output/
          if-no-files-found: error
          retention-days: 30

      - name: Commit version bump
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add pubspec.yaml

          if git diff --cached --quiet; then
            echo "No version changes to commit."
            exit 0
          fi

          git commit -m "chore: bump version to ${{ steps.version.outputs.new_version }}+${{ steps.version.outputs.new_build }}"

      - name: Push version bump
        shell: bash
        run: |
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
