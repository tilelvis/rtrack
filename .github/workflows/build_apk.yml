name: Build APK

# Manual trigger only. Auto-bumps patch version + build number when inputs
# are left empty. Produces a signed debug-keystore release APK that installs
# on any Android phone without needing Google Play.
#
# This workflow is SELF-HEALING: it cleans the repo of any legacy Groovy
# gradle files and writes the correct declarative Kotlin DSL files BEFORE
# running the build. So even if the user has stale .gradle files committed,
# the build will still succeed.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Semantic version (e.g. 1.4.0). Leave empty to auto-bump patch."
        required: false
        default: ""
      build_number:
        description: "Build number (integer). Leave empty to auto-increment."
        required: false
        default: ""
      build_type:
        description: "Build type"
        required: true
        type: choice
        options:
          - release
          - debug
        default: release

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Pin to Flutter 3.27.0 — the sweet spot:
      #   - Supports BOTH CardTheme (old) and CardThemeData (new Material 3 API)
      #   - Does NOT auto-migrate gradle files (unlike 3.32+)
      #   - Stable, well-tested, has all security patches up to 3.27.x
      # Using a SPECIFIC version (not "stable") means reproducible builds.
      - name: Setup Flutter 3.27.0 (pinned for stability)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.27.0"
          channel: stable
          cache: true

      - name: Show tool versions
        run: |
          flutter --version
          dart --version
          java -version

      # ------------------------------------------------------------------
      # SELF-HEALING GRADLE CLEANUP
      # ------------------------------------------------------------------
      # Delete any legacy Groovy .gradle files that would conflict with the
      # declarative .gradle.kts files. This guarantees the build always
      # starts from a clean state regardless of repo history.
      - name: Remove legacy Groovy gradle files
        shell: bash
        run: |
          echo "=== Before cleanup ==="
          ls -la android/ 2>/dev/null || true
          ls -la android/app/ 2>/dev/null || true

          # Delete old Groovy-style gradle files (the .kts versions are
          # the source of truth for Flutter 3.16+).
          rm -f android/build.gradle
          rm -f android/settings.gradle
          rm -f android/app/build.gradle

          # Also delete any stale local.properties (it should be generated
          # fresh by the workflow, never committed).
          rm -f android/local.properties

          # Delete generated plugin registrant (Flutter regenerates it).
          rm -f android/app/src/main/java/io/flutter/plugins/GeneratedPluginRegistrant.java
          rm -f android/app/src/main/kotlin/io/flutter/plugins/GeneratedPluginRegistrant.kt

          # Delete pubspec.lock so dependencies resolve fresh against the
          # pinned Flutter 3.27.0 version (avoids stale version pins
          # from older Flutter installs).
          rm -f pubspec.lock

          # Self-heal theme.dart: Flutter 3.27 supports BOTH CardTheme and
          # CardThemeData. We standardize on CardThemeData (the modern API)
          # to avoid future deprecation issues. This sed is idempotent.
          if [ -f lib/theme/theme.dart ]; then
            sed -i 's/cardTheme: CardTheme(/cardTheme: CardThemeData(/g' lib/theme/theme.dart
            echo "Normalized theme.dart to use CardThemeData"
          fi

          echo "=== After cleanup ==="
          ls -la android/ 2>/dev/null
          ls -la android/app/ 2>/dev/null

      # ------------------------------------------------------------------
      # Defensive: write the .kts files from scratch, ignoring whatever is
      # in the repo. This GUARANTEES the build always uses the correct
      # declarative plugins{} block.
      # ------------------------------------------------------------------
      - name: Write settings.gradle.kts (defensive)
        shell: bash
        run: |
          mkdir -p android
          cat > android/settings.gradle.kts <<'GRADLE_EOF'
          // Top-level Flutter settings.gradle.kts (declarative plugins{} block).
          // Required by Flutter 3.16+.

          pluginManagement {
              val flutterSdkPath = run {
                  val properties = java.util.Properties()
                  file("local.properties").inputStream().use { properties.load(it) }
                  val flutterSdkPath = properties.getProperty("flutter.sdk")
                  require(flutterSdkPath != null) { "flutter.sdk not set in local.properties" }
                  flutterSdkPath
              }

              includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          plugins {
              id("dev.flutter.flutter-plugin-loader") version "1.0.0"
              id("com.android.application") version "8.7.0" apply false
              id("org.jetbrains.kotlin.android") version "1.9.10" apply false
          }

          include(":app")
          GRADLE_EOF
          echo "Wrote android/settings.gradle.kts:"
          cat android/settings.gradle.kts

      - name: Write build.gradle.kts (root, defensive)
        shell: bash
        run: |
          cat > android/build.gradle.kts <<'GRADLE_EOF'
          // Top-level Android build file (Kotlin DSL).

          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }

          val newBuildDir: Directory = rootProject.layout.buildDirectory.dir("../../build").get()
          rootProject.layout.buildDirectory.value(newBuildDir)

          subprojects {
              val newSubprojectBuildDir: Directory = newBuildDir.dir(project.name)
              project.layout.buildDirectory.value(newSubprojectBuildDir)
          }

          subprojects {
              project.evaluationDependsOn(":app")
          }

          tasks.register<Delete>("clean") {
              delete(rootProject.layout.buildDirectory)
          }
          GRADLE_EOF
          echo "Wrote android/build.gradle.kts:"
          cat android/build.gradle.kts

      - name: Write app/build.gradle.kts (defensive)
        shell: bash
        run: |
          mkdir -p android/app
          cat > android/app/build.gradle.kts <<'GRADLE_EOF'
          // Android app module build configuration (Kotlin DSL, declarative plugins{}).
          // Versioning: code (integer) = build number, name (string) = semantic version.

          plugins {
              id("com.android.application")
              id("kotlin-android")
              // The Flutter Gradle Plugin must be applied AFTER android & kotlin.
              id("dev.flutter.flutter-gradle-plugin")
          }

          android {
              namespace = "com.example.loan_tracker"
              compileSdk = 36
              ndkVersion = flutter.ndkVersion

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }

              sourceSets {
                  getByName("main") {
                      java.srcDirs("src/main/kotlin")
                  }
              }

              defaultConfig {
                  applicationId = "com.example.loan_tracker"
                  minSdk = 21
                  targetSdk = 36
                  versionCode = flutter.versionCode.toInt()
                  versionName = flutter.versionName
              }

              buildTypes {
                  release {
                      // Sign release with the debug keystore so the APK installs on a phone
                      // without needing a separate upload key. Replace with a real keystore
                      // before publishing to Play Store.
                      signingConfig = signingConfigs.getByName("debug")
                      // Kotlin DSL uses `is` prefix for boolean Gradle properties.
                      isMinifyEnabled = false
                      isShrinkResources = false
                  }
                  debug {
                      signingConfig = signingConfigs.getByName("debug")
                  }
              }
          }

          flutter {
              source = "../.."
          }
          GRADLE_EOF
          echo "Wrote android/app/build.gradle.kts:"
          cat android/app/build.gradle.kts

      # ------------------------------------------------------------------
      # Version handling — auto-bump or accept manual override
      # ------------------------------------------------------------------
      - name: Read current version from pubspec
        id: current
        shell: bash
        run: |
          VERSION_LINE=$(grep -m1 -E '^version:[[:space:]]*[0-9]+\.[0-9]+\.[0-9]+\+[0-9]+' pubspec.yaml)
          if [ -z "$VERSION_LINE" ]; then
            echo "::error::No valid 'version: X.Y.Z+N' line found in pubspec.yaml"
            grep -n '^version:' pubspec.yaml || true
            exit 1
          fi
          CURRENT_VERSION=$(echo "$VERSION_LINE" | sed -E 's/^version:[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+)\+([0-9]+).*$/\1/')
          CURRENT_BUILD=$(echo "$VERSION_LINE" | sed -E 's/^version:[[:space:]]*[0-9]+\.[0-9]+\.[0-9]+\+([0-9]+).*$/\1/')
          echo "current_version=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"
          echo "current_build=$CURRENT_BUILD" >> "$GITHUB_OUTPUT"
          echo "Current: $CURRENT_VERSION+$CURRENT_BUILD"

      - name: Compute new version
        id: next
        shell: bash
        run: |
          CURRENT_VERSION="${{ steps.current.outputs.current_version }}"
          CURRENT_BUILD="${{ steps.current.outputs.current_build }}"
          INPUT_VERSION="${{ github.event.inputs.version }}"
          INPUT_BUILD="${{ github.event.inputs.build_number }}"

          if [ -n "$INPUT_VERSION" ]; then
            NEW_VERSION="$INPUT_VERSION"
          else
            IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VERSION"
            NEW_VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))"
          fi

          if [ -n "$INPUT_BUILD" ]; then
            NEW_BUILD="$INPUT_BUILD"
          else
            NEW_BUILD=$((CURRENT_BUILD + 1))
          fi

          if ! echo "$NEW_VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Invalid version '$NEW_VERSION' (expected X.Y.Z)"
            exit 1
          fi
          if ! echo "$NEW_BUILD" | grep -qE '^[0-9]+$'; then
            echo "::error::Invalid build '$NEW_BUILD' (expected integer)"
            exit 1
          fi

          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "new_build=$NEW_BUILD" >> "$GITHUB_OUTPUT"
          echo "Bumping: $CURRENT_VERSION+$CURRENT_BUILD -> $NEW_VERSION+$NEW_BUILD"

      - name: Update pubspec.yaml version
        shell: bash
        run: |
          NEW_VERSION="${{ steps.next.outputs.new_version }}"
          NEW_BUILD="${{ steps.next.outputs.new_build }}"
          sed -i -E "0,/^version:.*/s//version: ${NEW_VERSION}+${NEW_BUILD}/" pubspec.yaml
          echo "Updated pubspec.yaml:"
          grep -m1 '^version:' pubspec.yaml

      # ------------------------------------------------------------------
      # Dependency resolution
      # ------------------------------------------------------------------
      - name: Flutter pub get
        run: flutter pub get

      - name: Ensure local.properties
        shell: bash
        run: |
          mkdir -p android
          cat > android/local.properties <<EOF
          sdk.dir=$ANDROID_SDK_ROOT
          flutter.sdk=$FLUTTER_ROOT
          flutter.buildMode=debug
          EOF
          echo "Wrote android/local.properties:"
          cat android/local.properties

      # ------------------------------------------------------------------
      # Static analysis — does NOT block the build on warnings.
      # ------------------------------------------------------------------
      - name: Static analysis (errors block, warnings do not)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      # ------------------------------------------------------------------
      # APK build
      # ------------------------------------------------------------------
      - name: Build ${{ github.event.inputs.build_type }} APK
        run: |
          if [ "${{ github.event.inputs.build_type }}" = "release" ]; then
            flutter build apk --release \
              --build-name=${{ steps.next.outputs.new_version }} \
              --build-number=${{ steps.next.outputs.new_build }}
          else
            flutter build apk --debug \
              --build-name=${{ steps.next.outputs.new_version }} \
              --build-number=${{ steps.next.outputs.new_build }}
          fi

      # ------------------------------------------------------------------
      # Package + upload
      # ------------------------------------------------------------------
      - name: Stage APK + metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact
          BUILD_TYPE="${{ github.event.inputs.build_type }}"
          if [ "$BUILD_TYPE" = "release" ]; then
            APK_PATH="build/app/outputs/flutter-apk/app-release.apk"
          else
            APK_PATH="build/app/outputs/flutter-apk/app-debug.apk"
          fi
          if [ ! -f "$APK_PATH" ]; then
            echo "::error::APK not found at $APK_PATH"
            exit 1
          fi
          VERSION="${{ steps.next.outputs.new_version }}"
          BUILD="${{ steps.next.outputs.new_build }}"
          APK_NAME="loan_tracker-v${VERSION}+${BUILD}-${BUILD_TYPE}.apk"
          cp "$APK_PATH" "artifact/$APK_NAME"
          {
            echo "App: loan_tracker"
            echo "Version: ${VERSION}"
            echo "Build: ${BUILD}"
            echo "Type: ${BUILD_TYPE}"
            echo "Built: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo "Flutter: $(flutter --version | head -n 1)"
            echo "Commit: ${GITHUB_SHA::8}"
            echo "Run: ${GITHUB_RUN_NUMBER}"
          } > artifact/build_info.txt
          echo "${VERSION}" > artifact/version.txt
          echo "${BUILD}" > artifact/build_number.txt
          ls -lh artifact/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: loan-tracker-v${{ steps.next.outputs.new_version }}+${{ steps.next.outputs.new_build }}-${{ github.event.inputs.build_type }}
          path: artifact/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      # ------------------------------------------------------------------
      # Commit version bump + gradle fixes (best-effort)
      # ------------------------------------------------------------------
      - name: Commit & push changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pubspec.yaml android/
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore: bump version to v${{ steps.next.outputs.new_version }}+${{ steps.next.outputs.new_build }} + gradle cleanup [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          git push origin "HEAD:${GITHUB_REF_NAME}" || {
            echo "::warning::Failed to push (likely a concurrent build). The APK artifact is still available above."
          }
