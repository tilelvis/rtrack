name: Build APK

# Manual trigger only. Auto-bumps patch version + build number when inputs
# are left empty. Produces a signed debug-keystore release APK that installs
# on any Android phone without needing Google Play.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Semantic version (e.g. 1.4.0). Leave empty to auto-bump patch."
        required: false
        default: ""
      build_number:
        description: "Build number (integer). Leave empty to auto-increment."
        required: false
        default: ""
      build_type:
        description: "Build type"
        required: true
        type: choice
        options:
          - release
          - debug
        default: release

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show tool versions
        run: |
          flutter --version
          dart --version
          java -version

      # ------------------------------------------------------------------
      # Version handling — auto-bump or accept manual override
      # ------------------------------------------------------------------
      - name: Read current version from pubspec
        id: current
        shell: bash
        run: |
          VERSION_LINE=$(grep -m1 -E '^version:[[:space:]]*[0-9]+\.[0-9]+\.[0-9]+\+[0-9]+' pubspec.yaml)
          if [ -z "$VERSION_LINE" ]; then
            echo "::error::No valid 'version: X.Y.Z+N' line found in pubspec.yaml"
            grep -n '^version:' pubspec.yaml || true
            exit 1
          fi
          CURRENT_VERSION=$(echo "$VERSION_LINE" | sed -E 's/^version:[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+)\+([0-9]+).*$/\1/')
          CURRENT_BUILD=$(echo "$VERSION_LINE" | sed -E 's/^version:[[:space:]]*[0-9]+\.[0-9]+\.[0-9]+\+([0-9]+).*$/\1/')
          echo "current_version=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"
          echo "current_build=$CURRENT_BUILD" >> "$GITHUB_OUTPUT"
          echo "Current: $CURRENT_VERSION+$CURRENT_BUILD"

      - name: Compute new version
        id: next
        shell: bash
        run: |
          CURRENT_VERSION="${{ steps.current.outputs.current_version }}"
          CURRENT_BUILD="${{ steps.current.outputs.current_build }}"
          INPUT_VERSION="${{ github.event.inputs.version }}"
          INPUT_BUILD="${{ github.event.inputs.build_number }}"

          if [ -n "$INPUT_VERSION" ]; then
            NEW_VERSION="$INPUT_VERSION"
          else
            IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VERSION"
            NEW_VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))"
          fi

          if [ -n "$INPUT_BUILD" ]; then
            NEW_BUILD="$INPUT_BUILD"
          else
            NEW_BUILD=$((CURRENT_BUILD + 1))
          fi

          # Validate
          if ! echo "$NEW_VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Invalid version '$NEW_VERSION' (expected X.Y.Z)"
            exit 1
          fi
          if ! echo "$NEW_BUILD" | grep -qE '^[0-9]+$'; then
            echo "::error::Invalid build '$NEW_BUILD' (expected integer)"
            exit 1
          fi

          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "new_build=$NEW_BUILD" >> "$GITHUB_OUTPUT"
          echo "Bumping: $CURRENT_VERSION+$CURRENT_BUILD -> $NEW_VERSION+$NEW_BUILD"

      - name: Update pubspec.yaml version
        shell: bash
        run: |
          NEW_VERSION="${{ steps.next.outputs.new_version }}"
          NEW_BUILD="${{ steps.next.outputs.new_build }}"
          sed -i -E "0,/^version:.*/s//version: ${NEW_VERSION}+${NEW_BUILD}/" pubspec.yaml
          echo "Updated pubspec.yaml:"
          grep -m1 '^version:' pubspec.yaml

      # ------------------------------------------------------------------
      # Dependency resolution
      # ------------------------------------------------------------------
      - name: Flutter pub get
        run: flutter pub get

      - name: Ensure local.properties
        shell: bash
        run: |
          mkdir -p android
          cat > android/local.properties <<EOF
          sdk.dir=$ANDROID_SDK_ROOT
          flutter.sdk=$FLUTTER_ROOT
          flutter.buildMode=debug
          EOF
          echo "Wrote android/local.properties:"
          cat android/local.properties

      # ------------------------------------------------------------------
      # Static analysis — does NOT block the build on warnings.
      # Errors will still fail this step, which is correct because errors
      # would also fail the actual APK build below.
      # ------------------------------------------------------------------
      - name: Static analysis (errors block, warnings do not)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      # ------------------------------------------------------------------
      # APK build
      # ------------------------------------------------------------------
      - name: Build ${{ github.event.inputs.build_type }} APK
        run: |
          if [ "${{ github.event.inputs.build_type }}" = "release" ]; then
            flutter build apk --release \
              --build-name=${{ steps.next.outputs.new_version }} \
              --build-number=${{ steps.next.outputs.new_build }}
          else
            flutter build apk --debug \
              --build-name=${{ steps.next.outputs.new_version }} \
              --build-number=${{ steps.next.outputs.new_build }}
          fi

      # ------------------------------------------------------------------
      # Package + upload
      # ------------------------------------------------------------------
      - name: Stage APK + metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact
          BUILD_TYPE="${{ github.event.inputs.build_type }}"
          if [ "$BUILD_TYPE" = "release" ]; then
            APK_PATH="build/app/outputs/flutter-apk/app-release.apk"
          else
            APK_PATH="build/app/outputs/flutter-apk/app-debug.apk"
          fi
          if [ ! -f "$APK_PATH" ]; then
            echo "::error::APK not found at $APK_PATH"
            exit 1
          fi
          VERSION="${{ steps.next.outputs.new_version }}"
          BUILD="${{ steps.next.outputs.new_build }}"
          APK_NAME="loan_tracker-v${VERSION}+${BUILD}-${BUILD_TYPE}.apk"
          cp "$APK_PATH" "artifact/$APK_NAME"
          {
            echo "App: loan_tracker"
            echo "Version: ${VERSION}"
            echo "Build: ${BUILD}"
            echo "Type: ${BUILD_TYPE}"
            echo "Built: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo "Flutter: $(flutter --version | head -n 1)"
            echo "Commit: ${GITHUB_SHA::8}"
            echo "Run: ${GITHUB_RUN_NUMBER}"
          } > artifact/build_info.txt
          echo "${VERSION}" > artifact/version.txt
          echo "${BUILD}" > artifact/build_number.txt
          ls -lh artifact/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: loan-tracker-v${{ steps.next.outputs.new_version }}+${{ steps.next.outputs.new_build }}-${{ github.event.inputs.build_type }}
          path: artifact/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0  # APK is already compressed; don't waste time

      # ------------------------------------------------------------------
      # Commit version bump (best-effort; won't fail the build if push fails)
      # ------------------------------------------------------------------
      - name: Commit & push version bump
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pubspec.yaml
          if git diff --cached --quiet; then
            echo "No version changes to commit."
            exit 0
          fi
          git commit -m "chore: bump version to v${{ steps.next.outputs.new_version }}+${{ steps.next.outputs.new_build }} [skip ci]"
          # Rebase on top of any concurrent pushes, then push
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          git push origin "HEAD:${GITHUB_REF_NAME}" || {
            echo "::warning::Failed to push version bump (likely a concurrent build). The APK artifact is still available above."
          }
